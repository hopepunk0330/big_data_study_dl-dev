<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 663" width="900" height="663" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <filter id="cardShadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="blueGrad7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrowHead7" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="663" fill="#f4f5f7"/>

  <rect x="30" y="24" width="840" height="615" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#cardShadow7)"/>
  <rect x="30" y="24" width="840" height="8" rx="4" fill="url(#blueGrad7)"/>

  <!-- funnel icon (small, grouped tight with title — 16px gap cap) -->
  <path d="M68,50.2 L100,50.2 L88,66.2 L88,72.2 L80,72.2 L80,66.2 Z" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>
  <line x1="84" y1="72.2" x2="84" y2="75.2" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <circle cx="84" cy="77.2" r="1.5" fill="#2563eb"/>

  <text x="60" y="112" font-size="24" font-weight="bold" fill="#111">전처리 파이프라인 — 최종 피처 차원</text>
  <rect x="60" y="126" width="88" height="5" rx="2.5" fill="#2563eb"/>

  <text x="60" y="182.2" font-size="14" fill="#9ca3af">행 필터링</text>
  <text x="60" y="224.2" font-size="30" font-weight="bold" fill="#374151">923행 제거</text>

  <line x1="230" y1="208.2" x2="278" y2="208.2" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrowHead7)"/>

  <text x="310" y="182.2" font-size="14" fill="#9ca3af">최종 피처 차원</text>
  <text x="310" y="224.2" font-size="38" font-weight="bold" fill="#2563eb">155,526열</text>

  <text x="60" y="284.1" font-size="13" fill="#9ca3af">피처 구성 비중</text>
  <rect x="60" y="294.1" width="780" height="18" rx="4" fill="#f1f5f9"/>
  <rect x="60" y="294.1" width="501.5" height="18" fill="#1d4ed8"/>
  <rect x="561.5" y="294.1" width="250.4" height="18" fill="#60a5fa"/>
  <rect x="811.9" y="294.1" width="22.6" height="18" fill="#c7d2fe"/>
  <rect x="834.5" y="294.1" width="4.7" height="18" rx="2" fill="#e2e8f0"/>

  <rect x="60" y="322.1" width="120" height="22" rx="11" fill="#eff6ff"/>
  <text x="120" y="337.1" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="bold">desc TF-IDF 64%</text>
  <rect x="190" y="322.1" width="120" height="22" rx="11" fill="#eff6ff"/>
  <text x="250" y="337.1" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="bold">name TF-IDF 32%</text>
  <rect x="320" y="322.1" width="110" height="22" rx="11" fill="#eff6ff"/>
  <text x="375" y="337.1" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">brand 2.9%</text>
  <rect x="440" y="322.1" width="100" height="22" rx="11" fill="#f1f5f9"/>
  <text x="490" y="337.1" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="bold">기타 0.6%</text>

  <text x="60" y="395.3" font-size="14" fill="#9ca3af">메모리 절약 — 희소(sparse) 저장 vs 이론상 밀집(dense) 저장</text>

  <text x="60" y="434" font-size="14" fill="#9ca3af">이론상 밀집 행렬(float64)</text>
  <text x="60" y="476" font-size="30" font-weight="bold" fill="#374151">1,373GB</text>
  <line x1="245" y1="462.1" x2="300" y2="462.1" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrowHead7)"/>
  <text x="320" y="434" font-size="14" fill="#9ca3af">실제 저장(CSR 희소)</text>
  <text x="320" y="476" font-size="30" font-weight="bold" fill="#2563eb">650.6MB</text>
  <text x="60" y="500" font-size="12" fill="#6b7280">밀도 0.03% — 이론상 대비 2,162배 작다 (CSR 희소 저장)</text>

  <rect x="60" y="543" width="780" height="76" rx="10" fill="#eef2f7"/>
  <rect x="60" y="543" width="6" height="76" rx="3" fill="#1e3a5f"/>
  <text x="80" y="564" font-size="14" fill="#1e3a5f" font-weight="bold">→ 설계 문서 추정치(155,814열)보다 288열 적다 — train 80%로만 fit해 희소 브랜드·소분류 288종이</text>
  <text x="80" y="584" font-size="14" fill="#1e3a5f" font-weight="bold">train 조각에 등장하지 않았기 때문이다(RULE-01에 따른 정상 결과, 데이터 누수 아님).</text>
  <text x="80" y="604" font-size="14" fill="#1e3a5f" font-weight="bold">hstack 직후 del+gc.collect()로 중간 스파스 행렬을 해제해 이 절약을 실제로 지켰다.</text>
</svg>
