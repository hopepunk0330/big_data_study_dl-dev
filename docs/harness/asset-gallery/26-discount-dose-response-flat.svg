<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 868" width="1240" height="868" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="868" fill="#f4f5f7"/>

  <!-- title -->
  <circle cx="42" cy="46" r="14" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M35,52 L42,38 L49,52 M38,46 L46,46" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="52" font-size="26" font-weight="bold" fill="#111">할인 첫구매 용량-반응 — 기울기가 없다</text>
  <rect x="66" y="66" width="120" height="5" rx="2.5" fill="#2563eb"/>

  <!-- KPI cards -->
  <rect x="60" y="92" width="360" height="86" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="82" y="118" font-size="13" fill="#6b7280">구간별 90일 재구매율 범위</text>
  <text x="82" y="150" font-size="22" font-weight="bold" fill="#2563eb">92.84% ~ 93.22%</text>
  <text x="82" y="168" font-size="11.5" fill="#9ca3af">격차 0.37%p — 기울기 사실상 0</text>

  <rect x="440" y="92" width="360" height="86" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="462" y="118" font-size="13" fill="#6b7280">재구매시 할인이용률 범위</text>
  <text x="462" y="150" font-size="22" font-weight="bold" fill="#2563eb">99.68% ~ 100%</text>
  <text x="462" y="168" font-size="11.5" fill="#9ca3af">구간과 무관하게 전부 거의 100%</text>

  <rect x="820" y="92" width="360" height="86" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="842" y="118" font-size="13" fill="#6b7280">함정: 정가(0%) 구간 표본</text>
  <text x="842" y="150" font-size="22" font-weight="bold" fill="#e53935">14명뿐</text>
  <text x="842" y="168" font-size="11.5" fill="#9ca3af">전체 5,207명 중 0.27% — 결론 보류</text>

  <!-- bar chart -->
  <text x="66" y="222" font-size="17" font-weight="bold" fill="#111">할인 강도 3구간별 90일 재구매율 (Y축 85~100% 확대)</text>
  <line x1="200" y1="460" x2="1040" y2="460" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="284.0" y="376.2" width="112.0" height="83.8" fill="#93c5fd"/>
  <text x="340.0" y="368" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">92.86%</text>
  <text x="340.0" y="482" font-size="12" fill="#6b7280" text-anchor="middle">정가(0%)</text>
  <text x="340.0" y="498" font-size="11" fill="#9ca3af" text-anchor="middle">14명</text>

  <rect x="564.0" y="376.4" width="112.0" height="83.6" fill="#60a5fa"/>
  <text x="620.0" y="368" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">92.84%</text>
  <text x="620.0" y="482" font-size="12" fill="#6b7280" text-anchor="middle">저할인(0~10%)</text>
  <text x="620.0" y="498" font-size="11" fill="#9ca3af" text-anchor="middle">461명</text>

  <rect x="844.0" y="372.3" width="112.0" height="87.7" fill="#2563eb"/>
  <text x="900.0" y="364" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">93.22%</text>
  <text x="900.0" y="482" font-size="12" fill="#6b7280" text-anchor="middle">고할인(10%+)</text>
  <text x="900.0" y="498" font-size="11" fill="#9ca3af" text-anchor="middle">4,732명</text>

  <!-- flat trend line overlay -->
  <line x1="340" y1="376" x2="900" y2="374" stroke="#e53935" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="670" y="330" font-size="12" font-weight="bold" fill="#e53935" text-anchor="middle">용량-반응 기울기 ≈ 0</text>
  <line x1="670" y1="334" x2="670" y2="358" stroke="#e53935" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- robustness section -->
  <text x="66" y="546" font-size="17" font-weight="bold" fill="#111">강건성 확인 — 카테고리 층화 &amp; 경계 민감도</text>
  <rect x="66" y="558" width="110" height="4" rx="2" fill="#dc2626"/>

  <rect x="60" y="574" width="540" height="130" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="82" y="602" font-size="14" font-weight="bold" fill="#1d4ed8">6개 카테고리 층화</text>
  <text x="82" y="628" font-size="12.5" fill="#374151">도서·전자·가구·뷰티: 고할인-저할인 격차 1.4%p 이내</text>
  <text x="82" y="650" font-size="12.5" fill="#374151">식품·의류(표본 작음): 4~6%p대로 다소 큼</text>
  <text x="82" y="674" font-size="12.5" fill="#374151">→ 최대 격차도 6.4%p, 전체적으로 기울기 없음 유지</text>

  <rect x="640" y="574" width="540" height="130" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="662" y="602" font-size="14" font-weight="bold" fill="#dc2626">경계 재설정(10%→15%)</text>
  <text x="662" y="628" font-size="12.5" fill="#374151">저할인(0~15%) 93.17% vs 고할인(15%+) 93.19%</text>
  <text x="662" y="650" font-size="12.5" fill="#374151">할인이용률도 여전히 99.7~100%</text>
  <text x="662" y="674" font-size="12.5" fill="#374151">→ 경계값을 바꿔도 결론은 그대로</text>

  <!-- conclusion box -->
  <rect x="60" y="730" width="1120" height="118" rx="14" fill="#fff5f5" stroke="#e53935" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="86" y="760" font-size="15" font-weight="bold" fill="#e53935">허용 상한 조건부 권고: 재구매 데이터로는 할인 상한을 낮출 근거가 없다</text>
  <text x="86" y="786" font-size="13" fill="#374151">이 데이터 범위(할인 0~50%) 안에서 할인 강도가 90일 재구매율에 주는 해로운 효과를 확인할 수 없고,</text>
  <text x="86" y="808" font-size="13" fill="#374151">재구매 시 할인 이용은 첫 구매 할인 수준과 무관하게 모든 구간에서 이미 상시화(99~100%)돼 있다.</text>
  <text x="86" y="832" font-size="12" fill="#6b7280">단서: (1) 마진·수익성은 별도 검토 필요, (2) 정가 구간 표본(14명)이 극히 작아 그 구간 결론은 유보한다.</text>
</svg>
