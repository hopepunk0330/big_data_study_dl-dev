<text x="40" y="72" font-size="17" font-weight="800" fill="#14335c">비교 막대 + 목표선(대시) — 선을 막대보다 나중에 그려 위(z-order 상단)로 오게 한다</text>
<text x="40" y="94" font-size="12" fill="#64748b">목표 통과/미달성 항목을 원형 배지(체크/엑스)로 표시. 이 아래는 실제 리포트 인라인 SVG를 그대로 옮긴 것.</text>
<text x="40" y="112" font-size="12" fill="#64748b">좌표·수치는 이 프로젝트 고유값이니 무시하고 "선이 막대 rect보다 마크업 순서상 뒤에 온다"는 z-order 기법만 참고한다.</text>
