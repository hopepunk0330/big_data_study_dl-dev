<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="#f4f5f7"/>
  <text x="60" y="52" font-size="28" font-weight="bold" fill="#111">대사표 검산은 통과했지만 — 숨어있는 데이터 품질 이슈 2건</text>
  <rect x="60" y="66" width="88" height="5" rx="2.5" fill="#2563eb"/>
  <text x="60" y="96" font-size="16" fill="#6b7280">둘 다 검산식(총매출−순매출=제외액)만으로는 못 잡는다 — qa-reviewer 검증 발견</text>

  <!-- Card 1: unit_price 결측 -->
  <rect x="60" y="130" width="530" height="470" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="60" y="130" width="530" height="8" rx="4" fill="url(#blueGrad)"/>

  <!-- warning icon -->
  <path d="M105,175 L130,220 L80,220 Z" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
  <line x1="105" y1="188" x2="105" y2="203" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <circle cx="105" cy="211" r="1.8" fill="#dc2626"/>

  <text x="150" y="185" font-size="20" font-weight="bold" fill="#111">① <tspan font-family="Menlo, Consolas, monospace">unit_price</tspan> 결측</text>
  <text x="150" y="208" font-size="14" fill="#6b7280">단가가 비어있는데 매출은 조용히 0원 처리됨</text>

  <text x="90" y="270" font-size="46" font-weight="bold" fill="#e53935">14,969건</text>
  <text x="90" y="296" font-size="15" fill="#6b7280">최종 원장의 <tspan font-weight="bold" fill="#111">3.02%</tspan> (원본 15,113건과 거의 동일 비율)</text>

  <!-- connector: 헤드라인 숫자 -> 아래 '실제 영향' 박스 -->
  <path d="M330,258 L565,258 L565,450 L500,450" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <line x1="90" y1="320" x2="530" y2="320" stroke="#f3f4f6" stroke-width="1.5"/>

  <text x="90" y="352" font-size="15" fill="#374151">왜 위험한가:</text>
  <text x="105" y="378" font-size="14" fill="#4b5563">line_amount = quantity × unit_price × (1−discount)</text>
  <text x="105" y="400" font-size="14" fill="#4b5563">→ unit_price가 NaN이면 line_amount도 NaN</text>
  <text x="105" y="422" font-size="14" fill="#4b5563">→ <tspan font-family="Menlo, Consolas, monospace">groupby().sum()</tspan>이 이를 조용히 0으로 취급</text>

  <rect x="90" y="450" width="410" height="120" rx="10" fill="#eef2f7"/>
  <text x="110" y="478" font-size="14" fill="#1e3a5f" font-weight="bold">실제 영향</text>
  <text x="110" y="504" font-size="14" fill="#334155">모든 라인이 결측인 주문 <tspan font-weight="bold">1,171건</tspan></text>
  <text x="110" y="526" font-size="14" fill="#334155">→ 유효_주문수엔 1건씩 포함, 순매출엔 0원만 기여</text>
  <text x="110" y="552" font-size="16" font-weight="bold" fill="#dc2626">→ 향후 AOV(순매출/유효_주문수) 약 0.7% 과소평가</text>

  <!-- Card 2: quantity 음수 -->
  <rect x="610" y="130" width="530" height="470" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="610" y="130" width="530" height="8" rx="4" fill="url(#blueGrad)"/>

  <path d="M655,175 L680,220 L630,220 Z" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
  <line x1="655" y1="188" x2="655" y2="203" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <circle cx="655" cy="211" r="1.8" fill="#dc2626"/>

  <text x="700" y="185" font-size="20" font-weight="bold" fill="#111">② <tspan font-family="Menlo, Consolas, monospace">quantity</tspan> 음수</text>
  <text x="700" y="208" font-size="14" fill="#6b7280">'배송완료'인데 수량이 음수인 논리적 모순</text>

  <text x="640" y="270" font-size="46" font-weight="bold" fill="#e53935">281건</text>
  <text x="640" y="296" font-size="15" fill="#6b7280"><tspan font-family="Menlo, Consolas, monospace">canceled</tspan>/<tspan font-family="Menlo, Consolas, monospace">returned</tspan>가 <tspan font-weight="bold" fill="#111">아닌</tspan> 상태에서 발생</text>

  <!-- connector: 헤드라인 숫자 -> 상태별 분포 pill 그룹 -> 아래 '실제 영향' 박스 -->
  <path d="M800,258 L1090,258 L1090,450 L1050,450" fill="none" stroke="#bfdbfe" stroke-width="2"/>
  <path d="M1090,394 L905,394" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <line x1="640" y1="320" x2="1080" y2="320" stroke="#f3f4f6" stroke-width="1.5"/>

  <text x="640" y="352" font-size="15" fill="#374151">상태별 분포:</text>
  <rect x="655" y="365" width="130" height="26" rx="13" fill="#eff6ff"/>
  <text x="720" y="382" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">delivered 190건</text>
  <rect x="795" y="365" width="110" height="26" rx="13" fill="#eff6ff"/>
  <text x="850" y="382" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">shipped 54건</text>
  <rect x="655" y="398" width="100" height="26" rx="13" fill="#eff6ff"/>
  <text x="705" y="415" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">paid 37건</text>

  <rect x="640" y="450" width="410" height="120" rx="10" fill="#eef2f7"/>
  <text x="660" y="478" font-size="14" fill="#1e3a5f" font-weight="bold">실제 영향</text>
  <text x="660" y="504" font-size="14" fill="#334155">부분환불 인코딩인지 데이터 오류인지 알 수 없음</text>
  <text x="660" y="526" font-size="14" fill="#334155">→ 임의로 삭제·부호변환 안 하고 플래그만 표시</text>
  <text x="660" y="552" font-size="16" font-weight="bold" fill="#dc2626">→ 순매출에 약 −1,572만 원 그대로 folding됨</text>

  <!-- footer -->
  <text x="60" y="622" font-size="14" fill="#6b7280">두 이슈 모두 <tspan font-weight="bold" fill="#111">임의로 고치지 않고</tspan> 플래그 컬럼(<tspan font-family="Menlo, Consolas, monospace">unit_price_is_null</tspan>, <tspan font-family="Menlo, Consolas, monospace">neg_qty_uncancelled_flag</tspan>)만 남겨 도메인 담당자 판단에 맡긴다.</text>
</svg>
