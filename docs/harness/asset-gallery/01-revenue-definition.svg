<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#f4f5f7"/>
  <rect x="24" y="24" width="1152" height="652" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- title -->
  <text x="64" y="82" font-size="30" font-weight="bold" fill="#111">왜 두 팀의 매출 숫자가 다른가</text>
  <rect x="64" y="96" width="88" height="5" rx="2.5" fill="#2563eb"/>
  <text x="64" y="126" font-size="16" fill="#6b7280">상반기(2024-01~06) 원장 기준 — 같은 데이터, 다른 정의</text>

  <!-- 마케팅팀 badge + label (top) -->
  <circle cx="90" cy="185" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <!-- megaphone icon -->
  <path d="M82,178 L96,172 L96,198 L82,192 Z" fill="#2563eb"/>
  <rect x="79" y="180" width="4" height="10" rx="1.5" fill="#2563eb"/>
  <path d="M96,178 Q104,185 96,192" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <text x="126" y="180" font-size="19" font-weight="bold" fill="#111">마케팅팀 관점</text>
  <text x="126" y="202" font-size="14" fill="#6b7280">= 총매출 (모든 상태 포함)</text>
  <text x="990" y="192" font-size="24" font-weight="bold" fill="#2563eb" text-anchor="end">≈ 549억 원</text>

  <!-- connector from label down to bar -->
  <path d="M150,220 L150,255 L1050,255 L1050,220" fill="none" stroke="#c7d2fe" stroke-width="2"/>

  <!-- composition bar -->
  <rect x="150" y="290" width="900" height="110" rx="10" fill="#f3f4f6"/>
  <rect x="150" y="290" width="762" height="110" rx="10" fill="url(#blueGrad)" filter="url(#softShadow)"/>
  <rect x="948" y="290" width="132" height="110" rx="10" fill="url(#redGrad)" filter="url(#softShadow)"/>

  <text x="531" y="337" font-size="15" fill="#dbeafe" text-anchor="middle">순매출</text>
  <text x="531" y="365" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">≈ 466억 원</text>
  <text x="1014" y="335" font-size="13" font-weight="bold" fill="#fef2f2" text-anchor="middle">취소·반품</text>
  <text x="1014" y="352" font-size="13" font-weight="bold" fill="#fef2f2" text-anchor="middle">제외액</text>
  <text x="1014" y="374" font-size="13" fill="#fef2f2" text-anchor="middle">≈ 83억 (15%)</text>

  <!-- connector from bar down to bottom label -->
  <path d="M150,400 L150,435 L915,435 L915,400" fill="none" stroke="#bfdbfe" stroke-width="2"/>

  <!-- 재무팀 badge + label (bottom) -->
  <circle cx="90" cy="480" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <!-- document/ledger icon -->
  <rect x="80" y="469" width="20" height="24" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <line x1="84" y1="476" x2="96" y2="476" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="84" y1="481" x2="96" y2="481" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="84" y1="486" x2="92" y2="486" stroke="#2563eb" stroke-width="1.6"/>
  <text x="126" y="475" font-size="19" font-weight="bold" fill="#111">재무팀 관점</text>
  <text x="126" y="497" font-size="14" fill="#6b7280">= 순매출 (취소·반품 제외)</text>
  <text x="990" y="487" font-size="24" font-weight="bold" fill="#2563eb" text-anchor="end">≈ 466억 원</text>

  <!-- gap callout -->
  <line x1="1014" y1="435" x2="1014" y2="530" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="1014" cy="533" r="4" fill="#dc2626"/>
  <text x="1014" y="556" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">이 차이가 두 팀 숫자의 간극</text>

  <!-- conclusion band -->
  <rect x="64" y="590" width="1072" height="70" rx="10" fill="#eff6ff"/>
  <text x="90" y="617" font-size="15" fill="#111">두 팀 다 계산은 정확했다 — <tspan font-weight="bold" fill="#2563eb">"매출에 취소·반품을 포함할지"</tspan>의 정의만 서로 달랐을 뿐이다.</text>
  <text x="90" y="640" font-size="15" fill="#111">정의를 하나로 합의하면(예: 순매출 기준), 두 팀 숫자는 항상 재현 가능하게 일치한다.</text>
</svg>
