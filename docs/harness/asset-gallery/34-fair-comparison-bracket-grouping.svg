<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" font-family="'Noto Sans KR','Malgun Gothic','AppleGothic',sans-serif">
<defs>
<filter id="cardShadow1" x="-10%" y="-10%" width="120%" height="120%">
<feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
</filter>
</defs>
<rect x="10" y="10" width="900" height="620" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow1)"/>
<text x="40" y="46" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="0.06em">STYLE REFERENCE — 브래킷 그룹 분리</text>
<text x="40" y="72" font-size="17" font-weight="800" fill="#14335c">막대 여러 개를 "참고 기준" 그룹과 "같은 대상의 전/후" 그룹으로 브래킷+라벨로 시각 분리</text>
<text x="40" y="94" font-size="12" fill="#64748b">단순 색상 구분만으로는 그룹 관계가 헷갈릴 수 있는 지점(예: 4개 막대 중 2개는 비교 대상, 2개는 같은 것의 전/후)에서 씀.</text>
<text x="40" y="112" font-size="12" fill="#64748b">막대 아래 꺾인 선(path)+라벨로 그룹을 명시적으로 묶는다. 좌표·수치는 이 프로젝트 고유값이니 무시하고 브래킷 기법만 참고한다.</text>
<g transform="translate(20,18)">
<line x1="40" y1="423.5" x2="840" y2="423.5" stroke="#dbe2ec" stroke-width="1.2"/>
<rect x="100.0" y="395.45" width="140" height="28.05" rx="3" fill="#64748b"/>
<text x="170.0" y="382.25" font-size="15.414" font-weight="800" fill="#64748b" text-anchor="middle">100</text>
<text x="170.0" y="449.9" font-size="12.845" fill="#1a1a1a" text-anchor="middle">LightGBM</text>
<text x="170.0" y="469.7" font-size="12.845" fill="#1a1a1a" text-anchor="middle">n_estimators</text>
<rect x="280.0" y="395.45" width="140" height="28.05" rx="3" fill="#64748b"/>
<text x="350.0" y="382.25" font-size="15.414" font-weight="800" fill="#64748b" text-anchor="middle">100</text>
<text x="350.0" y="449.9" font-size="12.845" fill="#1a1a1a" text-anchor="middle">XGBoost</text>
<text x="350.0" y="469.7" font-size="12.845" fill="#1a1a1a" text-anchor="middle">n_estimators</text>
<rect x="460.0" y="143" width="140" height="280.5" rx="3" fill="#64748b"/>
<text x="530.0" y="129.8" font-size="15.414" font-weight="800" fill="#64748b" text-anchor="middle">1,000</text>
<text x="530.0" y="449.9" font-size="12.845" fill="#1a1a1a" text-anchor="middle">CatBoost</text>
<text x="530.0" y="469.7" font-size="12.845" fill="#1a1a1a" text-anchor="middle">iterations(기본값)</text>
<text x="530.0" y="492.8" font-size="11.047" fill="#94a3b8" text-anchor="middle">10배 차이 → 불공정</text>
<rect x="640.0" y="395.45" width="140" height="28.05" rx="3" fill="#0369a1"/>
<text x="710.0" y="382.25" font-size="15.414" font-weight="800" fill="#0369a1" text-anchor="middle">100</text>
<text x="710.0" y="449.9" font-size="12.845" fill="#1a1a1a" text-anchor="middle">CatBoost</text>
<text x="710.0" y="469.7" font-size="12.845" fill="#1a1a1a" text-anchor="middle">iterations(재정의)</text>
<text x="710.0" y="492.8" font-size="11.047" fill="#94a3b8" text-anchor="middle">3종 통일</text>
<line x1="600" y1="179.3" x2="624" y2="221" stroke="#b91c1c" stroke-width="2.2"/>
<rect x="626" y="199.1" width="122" height="89.1" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="687" y="237.05" font-size="17.983" font-weight="800" fill="#b91c1c" text-anchor="middle">10배 축소</text>
<text x="687" y="263.45" font-size="12.203" fill="#7f1d1d" text-anchor="middle">1,000 → 100</text>
<line x1="687" y1="288.2" x2="687" y2="380" stroke="#b91c1c" stroke-width="2.4"/>
<polygon points="687,392 679,376 695,376" fill="#b91c1c"/>
<path d="M 100,503 L 100,509 L 420,509 L 420,503" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
<text x="260" y="523" font-size="11.6" font-weight="700" fill="#64748b" text-anchor="middle">참고 기준 — 둘 다 100(공정 비교선)</text>
<path d="M 460,503 L 460,510 L 780,510 L 780,503" fill="none" stroke="#0369a1" stroke-width="1.8"/>
<text x="620" y="525" font-size="12.2" font-weight="800" fill="#0369a1" text-anchor="middle">CatBoost 하나 — 1,000→100 같은 모델의 전/후</text>
<text x="40" y="555" font-size="13.487" fill="#64748b">learning_rate 등 나머지 하이퍼파라미터는 각 라이브러리 기본값 그대로 유지 — 라운드 수만 통일</text>
</g>
</svg>
