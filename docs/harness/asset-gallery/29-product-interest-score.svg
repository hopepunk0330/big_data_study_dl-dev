<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1028" width="1240" height="1028" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="1028" fill="#f4f5f7"/>

  <!-- title -->
  <path d="M32,50 L42,36 L52,50 Z" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="42" y1="50" x2="42" y2="58" stroke="#2563eb" stroke-width="2.5"/>
  <text x="66" y="52" font-size="26" font-weight="bold" fill="#111">상품 관심 스코어 파이프라인 — 가중치를 바꿔도 순위는 흔들리지 않는다</text>
  <rect x="66" y="66" width="120" height="5" rx="2.5" fill="#2563eb"/>

  <!-- KPI cards -->
  <rect x="60" y="92" width="360" height="92" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="82" y="118" font-size="13" fill="#6b7280">가중치 가정(명시)</text>
  <text x="82" y="146" font-size="18" font-weight="bold" fill="#2563eb">view1 · cart3 · purchase5</text>
  <text x="82" y="168" font-size="11.5" fill="#9ca3af">+ 6월 이벤트 1.5배(최근성)</text>

  <rect x="440" y="92" width="360" height="92" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="462" y="118" font-size="13" fill="#6b7280">대안 가중치(view1/cart2/purchase8) top20</text>
  <text x="462" y="150" font-size="22" font-weight="bold" fill="#16a34a">20 / 20 겹침</text>
  <text x="462" y="168" font-size="11.5" fill="#166534">순위상관 0.999 — 가정에 강건</text>

  <rect x="820" y="92" width="360" height="92" rx="12" fill="#fff5f5" stroke="#e53935" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="842" y="118" font-size="13" fill="#6b7280">category 공백 오염 정제</text>
  <text x="842" y="150" font-size="22" font-weight="bold" fill="#e53935">12개 → 6개</text>
  <text x="842" y="168" font-size="11.5" fill="#9ca3af">"식품 "처럼 공백 혼입값 제거</text>

  <!-- formula -->
  <text x="66" y="230" font-size="17" font-weight="bold" fill="#111">스코어 산식 — 청크로 (상품×유형×최근월여부) 건수만 누적해두면 재읽기 없이 재계산 가능</text>
  <rect x="60" y="258" width="1120" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="620" y="288" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">score(product) = Σ  건수 × 이벤트가중치(view1/cart3/purchase5) × 최근성배율(6월 1.5, 그 외 1.0)</text>
  <text x="620" y="314" font-size="12" fill="#3b82f6" text-anchor="middle">검색(search) 이벤트는 product_id 결측 100% → dropna만으로 자연 제외</text>

  <!-- bar chart top5 -->
  <text x="66" y="372" font-size="17" font-weight="bold" fill="#111">관심 스코어 Top5</text>

  <text x="270" y="420" font-size="12.5" fill="#374151" text-anchor="end">401 데일리 샴푸</text>
  <rect x="280" y="402" width="821.7" height="26" rx="4" fill="#2563eb"/>
  <text x="1108" y="420" font-size="12" font-weight="bold" fill="#111">114,658</text>

  <text x="270" y="460" font-size="12.5" fill="#374151" text-anchor="end">287 프리미엄 잡지</text>
  <rect x="280" y="442" width="472.1" height="26" rx="4" fill="#60a5fa"/>
  <text x="759" y="460" font-size="12" font-weight="bold" fill="#111">65,877</text>

  <text x="270" y="500" font-size="12.5" fill="#374151" text-anchor="end">277 코어 향수</text>
  <rect x="280" y="482" width="339.5" height="26" rx="4" fill="#60a5fa"/>
  <text x="626" y="500" font-size="12" font-weight="bold" fill="#111">47,379</text>

  <text x="270" y="540" font-size="12.5" fill="#374151" text-anchor="end">394 프리미엄 티셔츠</text>
  <rect x="280" y="522" width="264.7" height="26" rx="4" fill="#93c5fd"/>
  <text x="551" y="540" font-size="12" font-weight="bold" fill="#111">36,941</text>

  <text x="270" y="580" font-size="12.5" fill="#374151" text-anchor="end">357 코어 초콜릿</text>
  <rect x="280" y="562" width="227.5" height="26" rx="4" fill="#93c5fd"/>
  <text x="514" y="580" font-size="12" font-weight="bold" fill="#111">31,746</text>

  <line x1="280" y1="604" x2="1140" y2="604" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- product 401 outlier callout -->
  <rect x="60" y="632" width="1120" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="86" y="660" font-size="13.5" font-weight="bold" fill="#1e3a5f">1위 product_id=401(데일리 샴푸)은 압도적 이상값</text>
  <text x="86" y="684" font-size="13" fill="#334155">전체 이벤트 61,984건 = 상품별 중앙값(760건)의 약 81배. 중복 행 없음, 세션 5.5만개·고객 4,706명에 고르게 분산 — 데이터 오류가 아니라 실제로 튀는 인기 상품.</text>
  <text x="86" y="704" font-size="11.5" fill="#1e3a5f">가격 이상값(product 268: -1,000원, 360: 0원)은 문제 13에서 이미 진단된 마스터 오염 — 이 리포트는 별도로 정제하지 않고 그대로 노출한다.</text>

  <!-- sensitivity mini diagram -->
  <text x="66" y="752" font-size="17" font-weight="bold" fill="#111">민감도 확인 — 가정을 바꿔도 순위는 거의 그대로</text>
  <rect x="60" y="780" width="540" height="90" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="82" y="806" font-size="13" font-weight="bold" fill="#374151">가중치 대안(view1/cart2/purchase8)</text>
  <text x="82" y="832" font-size="13" fill="#16a34a" font-weight="bold">top20 겹침 20/20, 순위상관 0.999</text>
  <text x="82" y="852" font-size="11" fill="#6b7280">구매 가중치를 5→8로 크게 올려도 순위 불변</text>

  <rect x="640" y="780" width="540" height="90" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="662" y="806" font-size="13" font-weight="bold" fill="#374151">최근성 배율(1.0 / 1.5 / 2.0)</text>
  <text x="662" y="832" font-size="13" fill="#16a34a" font-weight="bold">top5 product_id 동일: 401,287,277,394,357</text>
  <text x="662" y="852" font-size="11" fill="#6b7280">월별 이벤트 비중이 6개월 내내 고르기 때문</text>

  <!-- conclusion -->
  <rect x="60" y="914" width="1120" height="90" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="86" y="944" font-size="14.5" font-weight="bold" fill="#111">build_top_product_report() 함수 한 번 호출로 재적재→category 정제→top20 리포트까지 재생성</text>
  <text x="86" y="970" font-size="12.5" fill="#e53935" font-weight="bold">핵심: 청크로 (상품×유형×최근월) 건수만 누적해두면, 가중치 가정을 바꿔도 로그를 다시 읽지 않고 스코어만 재계산할 수 있다.</text>
  <text x="86" y="990" font-size="11" fill="#6b7280">참고: 가격 이상값 등 마스터 데이터 정제는 이 파이프라인의 범위 밖 — 추천 후보로 쓰기 전 별도 처리 필요.</text>
</svg>
