  <!-- conclusion box -->
  <rect x="60" y="510" width="1080" height="240" rx="14" fill="#fff5f5" stroke="#e53935" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="86" y="546" font-size="16" font-weight="bold" fill="#e53935">결론 — "저녁·주말 전환 우위" 가설은 이 데이터에서 성립하지 않는다</text>
  <text x="86" y="576" font-size="13.5" fill="#374151">168개 요일x시간대 셀의 전환율 실측 표준편차(1.26%p)가 순수 샘플링 잡음 하에서 기대되는 표준오차(1.17%p)와</text>
  <text x="86" y="598" font-size="13.5" fill="#374151">거의 같다 — 즉 관측된 24.19~31.75%의 셀 간 차이는 진짜 시간 효과가 아니라 잡음이다. 트래픽 상위5 시간대</text>
  <text x="86" y="620" font-size="13.5" fill="#374151">(월 6·7·16·11·3시)와 전환율 상위5 시간대(화 8·15·9시, 월 13시, 금 4시)는 <tspan font-weight="bold" fill="#e53935">단 하나도 겹치지 않는다.</tspan></text>
  <text x="86" y="642" font-size="13.5" fill="#374151">요일별로도 화(28.40%)~금(27.67%) 차이가 0.73%p에 불과해 "주말이 더 잘 팔린다"는 근거도 없다.</text>
  <text x="86" y="674" font-size="13.5" font-weight="bold" fill="#111">입찰 조정 의견: 이 데이터만으로는 특정 요일·시간대에 입찰을 강화/축소할 근거가 없다.</text>
  <text x="86" y="696" font-size="13.5" fill="#374151">시간대 차등입찰을 강행하려면 먼저 수 주 단위 A/B 실험으로 이 균일성이 재현되는지부터 검증해야 하며,</text>
  <text x="86" y="718" font-size="13.5" fill="#374151">그 전까지는 트래픽에 비례한 균등 배분이 총 구매 건수 관점에서 더 안전한 기본 전략이다.</text>
</svg>
