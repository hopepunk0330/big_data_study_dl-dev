<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <filter id="cardShadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="blueGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrowHead1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="590" fill="#f4f5f7"/>

  <rect x="30" y="24" width="840" height="542" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#cardShadow1)"/>
  <rect x="30" y="24" width="840" height="8" rx="4" fill="url(#blueGrad1)"/>

  <!-- skew-to-normal icon (small, grouped tight with title — 16px gap cap) -->
  <g>
    <rect x="60" y="62.7" width="6" height="4" fill="#93c5fd"/>
    <rect x="68" y="59.7" width="6" height="7" fill="#93c5fd"/>
    <rect x="76" y="54.7" width="6" height="12" fill="#60a5fa"/>
    <rect x="84" y="50.7" width="6" height="16" fill="#2563eb"/>
  </g>
  <path d="M96,58.7 L108,58.7" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrowHead1)"/>
  <path d="M116,64.7 Q126,52.7 136,64.7" fill="none" stroke="#2563eb" stroke-width="1.5"/>

  <text x="60" y="100" font-size="24" font-weight="bold" fill="#111">price 분포 — 로그 변환 효과</text>
  <rect x="60" y="114" width="88" height="5" rx="2.5" fill="#2563eb"/>

  <text x="60" y="170.2" font-size="14" fill="#9ca3af">왜도(skewness)</text>
  <text x="60" y="216.2" font-size="40" font-weight="bold" fill="#e53935">11.39</text>
  <line x1="164" y1="202.2" x2="206" y2="202.2" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowHead1)"/>
  <text x="218" y="216.2" font-size="40" font-weight="bold" fill="#16a34a">0.66</text>
  <text x="60" y="240.2" font-size="12" fill="#6b7280"><tspan font-family="Menlo, Consolas, monospace">log1p</tspan> 적용 후 — 정규분포에 근접</text>

  <text x="60" y="290.6" font-size="13" fill="#9ca3af">가격 분포 요약</text>
  <rect x="60" y="300.6" width="100" height="24" rx="12" fill="#eff6ff"/>
  <text x="110" y="316.6" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="bold">중앙값 $17</text>
  <rect x="170" y="300.6" width="110" height="24" rx="12" fill="#eff6ff"/>
  <text x="225" y="316.6" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="bold">평균 $26.74</text>
  <rect x="290" y="300.6" width="100" height="24" rx="12" fill="#ccfbf1"/>
  <text x="340" y="316.6" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="bold">p99 $170</text>

  <text x="60" y="356.6" font-size="14" fill="#1e3a5f" font-weight="bold">→ price==0인 874건(0.06%)은</text>
  <text x="60" y="376.6" font-size="14" fill="#1e3a5f" font-weight="bold">02_preprocessing에서 처리 방침 결정</text>

  <rect x="470" y="60" width="360" height="252" rx="10" fill="#eef2f7"/>
  <rect x="470" y="60" width="6" height="252" rx="3" fill="#1e3a5f"/>
  <text x="490" y="90" font-size="14" fill="#1e3a5f" font-weight="bold">그래서 무슨 의미인가</text>
  <text x="490" y="118" font-size="14" fill="#334155">평가지표가 RMSLE라 로그 변환이 필요한데,</text>
  <text x="490" y="140" font-size="14" fill="#334155">실제로 왜도가 크게 줄어 정규분포에</text>
  <text x="490" y="162" font-size="14" fill="#334155">가까워진다 — 로그 타겟 채택 근거 확보.</text>
  <line x1="490" y1="184" x2="810" y2="184" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="490" y="212" font-size="13" fill="#334155">가격 상위 0.1%(p99.9)는 $450까지 벌어져</text>
  <text x="490" y="232" font-size="13" fill="#334155">RMSE 대신 RMSLE·로그 타겟이 이 데이터에</text>
  <text x="490" y="252" font-size="13" fill="#334155">더 적합하다는 걸 뒷받침한다.</text>

  <text x="60" y="427.8" font-size="14" fill="#9ca3af">가격 분포 상세 — IQR 기준 상자그림 (Q1~Q3·중앙값·이상치 임계값)</text>

  <text x="239.7" y="465.1" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">중앙값 $17</text>
  <line x1="239.7" y1="468.1" x2="239.7" y2="478.1" stroke="#9ca3af" stroke-width="1.5"/>

  <line x1="60" y1="495.1" x2="165.7" y2="495.1" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="60" y1="487.1" x2="60" y2="503.1" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="366.6" y1="495.1" x2="667.9" y2="495.1" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="667.9" y1="487.1" x2="667.9" y2="503.1" stroke="#9ca3af" stroke-width="1.5"/>

  <rect x="667.9" y="478.1" width="132.1" height="34" fill="#fee2e2"/>
  <rect x="165.7" y="478.1" width="200.9" height="34" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="239.7" y1="478.1" x2="239.7" y2="512.1" stroke="#1d4ed8" stroke-width="2"/>

  <text x="60" y="545.7" font-size="12" fill="#6b7280" text-anchor="middle">$0</text>
  <text x="165.7" y="545.7" font-size="12" fill="#6b7280" text-anchor="middle">$10 (Q1)</text>
  <text x="366.6" y="545.7" font-size="12" fill="#6b7280" text-anchor="middle">$29 (Q3)</text>
  <text x="733.95" y="545.7" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">8.05% 이상치 ($57.5+)</text>
</svg>
