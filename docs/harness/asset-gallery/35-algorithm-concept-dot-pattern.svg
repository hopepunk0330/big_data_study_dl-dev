<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 460" width="1020" height="460" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<defs>
<filter id="cardShadow1" x="-10%" y="-10%" width="120%" height="120%">
<feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
</filter>
</defs>
<rect x="10" y="10" width="1000" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow1)"/>
<text x="20" y="60" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="0.06em">STYLE REFERENCE — 무데이터 점(dot) 패턴 개념도</text>
<g transform="translate(0,70)">
<rect x="20" y="30" width="280" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="160" y="70" font-size="17" font-weight="bold" fill="#334155" text-anchor="middle">Grid Search (격자 탐색)</text>
<line x1="40" y1="85" x2="280" y2="85" stroke="#cbd5e1" stroke-width="1.0"/>
<circle cx="90" cy="140" r="5" fill="#94a3b8"/><circle cx="160" cy="140" r="5" fill="#94a3b8"/><circle cx="230" cy="140" r="5" fill="#94a3b8"/>
<circle cx="90" cy="190" r="5" fill="#94a3b8"/><circle cx="160" cy="190" r="5" fill="#94a3b8"/><circle cx="230" cy="190" r="5" fill="#94a3b8"/>
<circle cx="90" cy="240" r="5" fill="#94a3b8"/><circle cx="160" cy="240" r="5" fill="#94a3b8"/><circle cx="230" cy="240" r="5" fill="#94a3b8"/>
<text x="160" y="285" font-size="14" fill="#64748b" text-anchor="middle">균일한 격자상의 지점만 평가</text>
<text x="160" y="308" font-size="12.5" fill="#94a3b8" text-anchor="middle">격자 사이의 진짜 최적점 유실 가능</text>

<rect x="360" y="30" width="280" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="500" y="70" font-size="17" font-weight="bold" fill="#334155" text-anchor="middle">Random Search (무작위 탐색)</text>
<line x1="380" y1="85" x2="620" y2="85" stroke="#cbd5e1" stroke-width="1.0"/>
<circle cx="410" cy="130" r="5" fill="#64748b"/><circle cx="470" cy="170" r="5" fill="#64748b"/><circle cx="580" cy="120" r="5" fill="#64748b"/>
<circle cx="530" cy="220" r="5" fill="#64748b"/><circle cx="440" cy="250" r="5" fill="#64748b"/><circle cx="610" cy="200" r="5" fill="#64748b"/>
<circle cx="490" cy="140" r="5" fill="#64748b"/><circle cx="560" cy="260" r="5" fill="#64748b"/>
<text x="500" y="285" font-size="14" fill="#64748b" text-anchor="middle">구간 내 확률적 무작위 샘플링</text>
<text x="500" y="308" font-size="12.5" fill="#94a3b8" text-anchor="middle">운에 기댄 분포, 불필요 영역 반복 평가</text>

<rect x="700" y="30" width="280" height="300" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2.0"/>
<text x="840" y="70" font-size="17" font-weight="bold" fill="#0369a1" text-anchor="middle">Bayesian (Optuna TPE)</text>
<line x1="720" y1="85" x2="960" y2="85" stroke="#bae6fd" stroke-width="1.0"/>
<circle cx="750" cy="130" r="4.5" fill="#94a3b8"/><circle cx="940" cy="160" r="4.5" fill="#94a3b8"/>
<circle cx="830" cy="200" r="6.5" fill="#0284c7"/><circle cx="845" cy="190" r="6.5" fill="#0284c7"/><circle cx="838" cy="215" r="6.5" fill="#0284c7"/>
<circle cx="850" cy="205" r="6.5" fill="#0284c7"/><circle cx="820" cy="195" r="6.5" fill="#0284c7"/><circle cx="840" cy="202" r="8" fill="none" stroke="#0ea5e9" stroke-width="2.0"/>
<text x="840" y="285" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">과거 평가 결과를 토대로 최적 분포 학습</text>
<text x="840" y="308" font-size="13" font-weight="bold" fill="#0284c7" text-anchor="middle">유망 구간(alpha 3.3)으로 시도 집중 수렴</text>
</g>
</svg>
