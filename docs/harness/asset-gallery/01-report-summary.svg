  <rect x="56" y="1816" width="1088" height="150" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="80" y="1850" font-size="16" font-weight="bold" fill="#1e3a8a">결론</text>
  <text x="80" y="1880" font-size="15" fill="#1e293b">두 팀 숫자 차이의 원인은 계산 실수가 아니라 <tspan font-weight="bold">"매출에 취소·반품을 포함할지"</tspan>의 정의 차이였다.</text>
  <text x="80" y="1906" font-size="15" fill="#1e293b">정의를 순매출 기준으로 합의하면, 두 팀 숫자는 항상 재현 가능하게 일치한다.</text>
  <text x="80" y="1940" font-size="15" fill="#1e293b">단, <tspan font-weight="bold" fill="#dc2626">unit_price 결측·quantity 음수 이슈는 미해결 상태</tspan>로 원장에 남아있어, 문제 02~30에서 이 원장을 재사용할 땐 다시 고려해야 한다.</text>
</svg>
