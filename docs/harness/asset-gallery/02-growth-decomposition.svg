<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="headerGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="freqGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="780" fill="#f4f5f7"/>
  <rect x="20" y="20" width="960" height="740" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow2)"/>

  <!-- header -->
  <rect x="20" y="20" width="960" height="104" rx="20" fill="url(#headerGrad2)"/>
  <rect x="20" y="84" width="960" height="40" fill="url(#headerGrad2)"/>
  <text x="52" y="56" font-size="14" fill="#bfdbfe" letter-spacing="1">문제 02 · 상반기 성장 기여 분해</text>
  <text x="52" y="90" font-size="26" font-weight="bold" fill="#ffffff">무엇이 매출을 밀어올렸나 — 1월 → 6월</text>

  <!-- KPI row (header bottom 124 -> title 180 -> content 224 근처를 위해 카드 top 224로) -->
  <text x="52" y="164" font-size="18" font-weight="bold" fill="#111">핵심 지표 (1월 대비 6월 변화율)</text>
  <rect x="52" y="174" width="56" height="4" rx="2" fill="#2563eb"/>

  <g>
    <rect x="44" y="216" width="210" height="110" rx="12" fill="#eff6ff"/>
    <text x="66" y="246" font-size="13" fill="#1e40af">순매출 성장</text>
    <text x="66" y="288" font-size="26" font-weight="bold" fill="#2563eb">+82.8%</text>
    <text x="66" y="310" font-size="12" fill="#3b82f6">55.3억 → 101.1억</text>

    <rect x="278" y="216" width="210" height="110" rx="12" fill="#eff6ff"/>
    <text x="300" y="246" font-size="13" fill="#1e40af">구매고객수</text>
    <text x="300" y="288" font-size="26" font-weight="bold" fill="#2563eb">+17.8%</text>
    <text x="300" y="310" font-size="12" fill="#3b82f6">4,038명 → 4,755명</text>

    <rect x="512" y="216" width="210" height="110" rx="12" fill="#eff6ff"/>
    <text x="534" y="246" font-size="13" fill="#1e40af">고객당 주문수</text>
    <text x="534" y="288" font-size="26" font-weight="bold" fill="#e53935">+55.4%</text>
    <text x="534" y="310" font-size="12" fill="#3b82f6">4.56건 → 7.09건</text>

    <rect x="746" y="216" width="210" height="110" rx="12" fill="#f3f4f6"/>
    <text x="768" y="246" font-size="13" fill="#4b5563">AOV(객단가)</text>
    <text x="768" y="288" font-size="26" font-weight="bold" fill="#6b7280">-0.1%</text>
    <text x="768" y="310" font-size="12" fill="#6b7280">거의 변화 없음</text>
  </g>

  <!-- connector bracket: KPI 순매출 성장 -> 아래 분해 섹션 -->
  <path d="M149,326 L149,344 L149,344" fill="none" stroke="#c7d2fe" stroke-width="2"/>
  <path d="M149,326 L149,352" fill="none" stroke="#c7d2fe" stroke-width="2"/>

  <!-- section: 로그 기여율 분해 (KPI end 326 -> title 398, gap 48+) -->
  <text x="52" y="398" font-size="18" font-weight="bold" fill="#111">성장 기여율 분해 (로그 분해, 합계 100%)</text>
  <rect x="52" y="408" width="56" height="4" rx="2" fill="#2563eb"/>

  <!-- content top 440 (gap 24 from underline 408~412) -->
  <!-- axis guide 0/25/50/75/100 -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="250" y1="432" x2="250" y2="592"/>
    <line x1="412.5" y1="432" x2="412.5" y2="592"/>
    <line x1="575" y1="432" x2="575" y2="592"/>
    <line x1="737.5" y1="432" x2="737.5" y2="592"/>
    <line x1="900" y1="432" x2="900" y2="592"/>
  </g>
  <g font-size="11" fill="#9ca3af" text-anchor="middle">
    <text x="250" y="424">0%</text>
    <text x="412.5" y="424">25%</text>
    <text x="575" y="424">50%</text>
    <text x="737.5" y="424">75%</text>
    <text x="900" y="424">100%</text>
  </g>

  <!-- row1: 고객당 주문수 73.1% -->
  <text x="52" y="463" font-size="14" fill="#111">고객당 주문수</text>
  <text x="52" y="480" font-size="11" fill="#6b7280">(재구매 빈도)</text>
  <rect x="250" y="440" width="475" height="34" rx="6" fill="url(#freqGrad)"/>
  <text x="735" y="463" font-size="15" font-weight="bold" fill="#e53935">73.1%</text>

  <!-- row2: 구매고객수 27.1% -->
  <text x="52" y="517" font-size="14" fill="#111">구매고객수</text>
  <text x="52" y="534" font-size="11" fill="#6b7280">(신규·활성 고객)</text>
  <rect x="250" y="494" width="176" height="34" rx="6" fill="#93c5fd"/>
  <text x="436" y="517" font-size="15" font-weight="bold" fill="#1e40af">27.1%</text>

  <!-- row3: AOV -0.2% -->
  <text x="52" y="571" font-size="14" fill="#111">AOV(객단가)</text>
  <rect x="247" y="548" width="6" height="34" rx="2" fill="#9ca3af"/>
  <text x="266" y="571" font-size="14" fill="#6b7280">-0.2% (사실상 0)</text>

  <!-- conclusion (content end 592 -> box top 640, gap 48) -->
  <rect x="52" y="640" width="896" height="110" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="76" y="672" font-size="16" font-weight="bold" fill="#1e3a8a">결론</text>
  <text x="76" y="700" font-size="15" fill="#1e293b">상반기 성장(+82.8%)의 <tspan font-weight="bold" fill="#e53935">73.1%는 재구매 빈도(고객당 주문수) 증가</tspan>에서 왔다.</text>
  <text x="76" y="726" font-size="15" fill="#1e293b">신규 고객 유입 기여는 27.1%, 객단가 변화는 사실상 0% — 처방은 <tspan font-weight="bold">획득 마케팅보다 재구매 유도</tspan>다.</text>
</svg>
