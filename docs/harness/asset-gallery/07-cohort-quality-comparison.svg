<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 742" width="1000" height="742" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <filter id="cardShadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="headerGrad7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="742" fill="#f4f5f7"/>
  <rect x="20" y="20" width="960" height="702" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#cardShadow7)"/>

  <!-- header -->
  <rect x="20" y="20" width="960" height="104" rx="20" fill="url(#headerGrad7)"/>
  <rect x="20" y="84" width="960" height="40" fill="url(#headerGrad7)"/>
  <text x="52" y="56" font-size="14" fill="#bfdbfe" letter-spacing="1">문제 07 · 상·하반기 신규 코호트 질 비교</text>
  <text x="52" y="90" font-size="24" font-weight="bold" fill="#ffffff">관찰창을 맞춰도 좁혀지지 않는 격차</text>

  <!-- KPI cards -->
  <g>
    <rect x="44" y="148" width="280" height="100" rx="12" fill="#eff6ff"/>
    <text x="66" y="176" font-size="13" fill="#1e40af">코호트 A(1~2월) 30일 재구매율</text>
    <text x="66" y="214" font-size="26" font-weight="bold" fill="#2563eb">81.2%</text>

    <rect x="348" y="148" width="280" height="100" rx="12" fill="#fef2f2"/>
    <text x="370" y="176" font-size="13" fill="#991b1b">코호트 B(4~5월) 30일 재구매율</text>
    <text x="370" y="214" font-size="26" font-weight="bold" fill="#e53935">9.1%</text>

    <rect x="652" y="148" width="280" height="100" rx="12" fill="#f3f4f6"/>
    <text x="674" y="176" font-size="13" fill="#4b5563">상반기 전체 주문수 중위값(F)</text>
    <text x="674" y="214" font-size="22" font-weight="bold" fill="#374151">A 15건 vs B 1건</text>
  </g>

  <!-- chart -->
  <text x="52" y="288" font-size="17" font-weight="bold" fill="#111">채널별 30일 재구매율 — 격차가 모든 채널에서 유지되는가</text>
  <rect x="52" y="298" width="56" height="4" rx="2" fill="#2563eb"/>

  <!-- legend -->
  <rect x="700" y="278" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="720" y="290" font-size="12" fill="#374151">코호트 A</text>
  <rect x="800" y="278" width="14" height="14" rx="3" fill="#e53935"/>
  <text x="820" y="290" font-size="12" fill="#374151">코호트 B</text>

  <!-- axis -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="200" y1="316" x2="200" y2="466"/>
    <line x1="350" y1="316" x2="350" y2="466"/>
    <line x1="500" y1="316" x2="500" y2="466"/>
    <line x1="650" y1="316" x2="650" y2="466"/>
    <line x1="800" y1="316" x2="800" y2="466"/>
  </g>
  <g font-size="11" fill="#9ca3af" text-anchor="middle">
    <text x="200" y="310">0%</text>
    <text x="350" y="310">25%</text>
    <text x="500" y="310">50%</text>
    <text x="650" y="310">75%</text>
    <text x="800" y="310">100%</text>
  </g>

  <!-- row: web -->
  <text x="44" y="343" font-size="14" font-weight="bold" fill="#111">web</text>
  <rect x="200" y="322" width="489.6" height="16" rx="3" fill="#2563eb"/>
  <text x="700" y="335" font-size="12" font-weight="bold" fill="#1e40af">81.6%</text>
  <rect x="200" y="342" width="66.7" height="16" rx="3" fill="#e53935"/>
  <text x="277" y="355" font-size="12" font-weight="bold" fill="#e53935">11.1%</text>

  <!-- row: app -->
  <text x="44" y="397" font-size="14" font-weight="bold" fill="#111">app</text>
  <rect x="200" y="376" width="487.1" height="16" rx="3" fill="#2563eb"/>
  <text x="697" y="389" font-size="12" font-weight="bold" fill="#1e40af">81.2%</text>
  <rect x="200" y="396" width="40.3" height="16" rx="3" fill="#e53935"/>
  <text x="251" y="409" font-size="12" font-weight="bold" fill="#e53935">6.7%</text>

  <!-- row: store -->
  <text x="44" y="451" font-size="14" font-weight="bold" fill="#111">store</text>
  <rect x="200" y="430" width="476.9" height="16" rx="3" fill="#2563eb"/>
  <text x="687" y="443" font-size="12" font-weight="bold" fill="#1e40af">79.5%</text>
  <rect x="200" y="450" width="40.0" height="16" rx="3" fill="#e53935"/>
  <text x="251" y="463" font-size="12" font-weight="bold" fill="#e53935">6.7%</text>

  <!-- conclusion -->
  <rect x="44" y="506" width="912" height="216" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="68" y="536" font-size="16" font-weight="bold" fill="#1e3a8a">최종 판정</text>
  <text x="68" y="562" font-size="14" fill="#1e293b">동일 30일 관찰창으로 맞춰도 격차는 그대로다(재구매율 81.2% vs 9.1%).</text>
  <text x="68" y="584" font-size="14" fill="#1e293b">채널 구성도 A·B가 거의 같고(둘 다 web 54%대), <tspan font-weight="bold">모든 채널에서 격차가 유지</tspan>돼 특정 채널 유입 악화라는 설명은 기각된다.</text>
  <text x="68" y="612" font-size="14" fill="#1e293b">다만 <tspan font-weight="bold" fill="#e53935">코호트 A·B의 상반기 전체 주문 빈도가 극단적으로 다르다(중위값 15건 vs 1건)</tspan>.</text>
  <text x="68" y="634" font-size="14" fill="#1e293b">이는 6개월이라는 짧은 관측 창이 "원래 자주 사는 고객"을 이른 코호트에 몰아넣는 통계적 편향일 가능성을 시사한다.</text>
  <text x="68" y="662" font-size="14" fill="#1e293b"><tspan font-weight="bold">따라서 "광고비 확대로 신규 고객 질이 나빠졌다"고 이 데이터만으로 단정할 수 없다</tspan> — 실제 회원가입일 등 별도</text>
  <text x="68" y="684" font-size="14" fill="#1e293b">기준으로 재검증이 필요하다는 것이 정직한 결론이다.</text>
</svg>
