  <text x="600.0" y="308.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="600.0" y="362.0" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">ResNet 구조 직접 구현</text>
  <text x="600.0" y="386.0" font-size="13" fill="#64748b" text-anchor="middle">chap08 CNN의 다음 단계</text>
  <rect x="575.0" y="400.0" width="50.0" height="28.0" rx="14" fill="#ccfbf1"/>
