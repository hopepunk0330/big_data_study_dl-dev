  <text x="210.0" y="362.0" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">전이학습 (ResNet18)</text>
  <text x="210.0" y="386.0" font-size="13" fill="#64748b" text-anchor="middle">교재 학습 루프 그대로, 실무 1순위</text>
  <rect x="185.0" y="400.0" width="50.0" height="28.0" rx="14" fill="#ccfbf1"/>
  <text x="210.0" y="419.0" font-size="13" fill="#0f766e" font-weight="700" text-anchor="middle">충분</text>
