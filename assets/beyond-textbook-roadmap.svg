<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780"
     font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <defs>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <filter id="boxShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1240" height="780" fill="#f8fafc"/>
  <rect x="24" y="24" width="1192" height="732" rx="20" fill="#ffffff" filter="url(#cardShadow)"/>
  <text x="64.0" y="92.0" font-size="34" fill="#0f172a" font-weight="700">추천 학습 순서 — 교재 다음 단계</text>
  <text x="64.0" y="126.0" font-size="17" fill="#64748b">교재 코드를 그대로 이어 쓸 수 있는 것부터, GPU 부담이 작은 것부터</text>
  <rect x="64.0" y="142.0" width="140.0" height="6.0" rx="3" fill="#2563eb"/>
  <text x="64.0" y="190.0" font-size="14" fill="#475569" font-weight="700">GTX 1660 SUPER(6GB) 기준 :</text>
