  <circle cx="960" cy="300" r="30" fill="#2563eb" stroke="#ffffff" stroke-width="4"/>
  <text x="960.0" y="308.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="960.0" y="362.0" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">어텐션 · 작은 트랜스포머</text>
  <text x="960.0" y="386.0" font-size="13" fill="#64748b" text-anchor="middle">chap09 RNN과 비교하며 이해</text>
  <rect x="898.6" y="400.0" width="122.8" height="28.0" rx="14" fill="#dbeafe"/>
  <text x="960.0" y="419.0" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle">작은 모델은 충분</text>
  <circle cx="960" cy="540" r="30" fill="#2563eb" stroke="#ffffff" stroke-width="4"/>
  <text x="960.0" y="548.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <text x="960.0" y="602.0" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">객체 탐지 (YOLO)</text>
  <text x="960.0" y="626.0" font-size="13" fill="#64748b" text-anchor="middle">결과가 눈에 보여 이해가 빠름</text>
  <rect x="898.6" y="640.0" width="122.8" height="28.0" rx="14" fill="#dbeafe"/>
  <text x="960.0" y="659.0" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle">작은 모델은 충분</text>
  <circle cx="600" cy="540" r="30" fill="#2563eb" stroke="#ffffff" stroke-width="4"/>
  <text x="600.0" y="548.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
  <text x="600.0" y="602.0" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">생성 모델 (GAN → 디퓨전)</text>
  <text x="600.0" y="626.0" font-size="13" fill="#64748b" text-anchor="middle">chap10 오토인코더의 확장</text>
  <rect x="566.5" y="640.0" width="66.9" height="28.0" rx="14" fill="#fee2e2"/>
  <text x="600.0" y="659.0" font-size="13" fill="#dc2626" font-weight="700" text-anchor="middle">부담 큼</text>
  <circle cx="210" cy="540" r="30" fill="#2563eb" stroke="#ffffff" stroke-width="4"/>
  <text x="210.0" y="548.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
  <text x="210.0" y="602.0" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">언어모델 파인튜닝 (LoRA)</text>
  <text x="210.0" y="626.0" font-size="13" fill="#64748b" text-anchor="middle">요즘 가장 수요가 많은 기술</text>
  <rect x="176.6" y="640.0" width="66.9" height="28.0" rx="14" fill="#fee2e2"/>
  <text x="210.0" y="659.0" font-size="13" fill="#dc2626" font-weight="700" text-anchor="middle">부담 큼</text>
  <text x="210.0" y="256.0" font-size="13" fill="#0f766e" font-weight="700" text-anchor="middle">여기서 시작</text>
  <rect x="64.0" y="692.0" width="1112.0" height="56.0" rx="10" fill="#eef2f7"/>
  <rect x="64.0" y="692.0" width="6.0" height="56.0" rx="3" fill="#1e3a5f"/>
  <text x="92.0" y="727.0" font-size="16" fill="#1e3a5f" font-weight="700">1번(전이학습)만 해도, 교재에서 배운 실력으로 실무형 이미지 분류 모델을 만들 수 있다.</text>
