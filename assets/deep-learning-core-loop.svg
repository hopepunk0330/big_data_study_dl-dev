<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="824" viewBox="0 0 1180 824"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <filter id="boxShadow" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1180" height="824" fill="#f8fafc"/>
  <rect x="24" y="24" width="1132" height="776" rx="20" fill="#ffffff" filter="url(#cardShadow)"/>

  <text x="64" y="88" font-size="34" font-weight="700" fill="#0f172a">딥러닝의 뼈대</text>
  <text x="64" y="120" font-size="17" fill="#64748b">층 하나의 계산 + 학습 4단계 — 교재 전 과정이 이 두 가지의 반복이다</text>
  <rect x="64" y="136" width="120" height="6" rx="3" fill="#2563eb"/>

  <text x="64" y="202" font-size="20" font-weight="700" fill="#1e3a5f">① 층 하나가 하는 계산</text>
  <rect x="356" y="184" width="88" height="26" rx="13" fill="#dbeafe"/>
  <text x="400" y="202" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">chap02</text>

  <rect x="64" y="252" width="190" height="96" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
  <rect x="86" y="272" width="7" height="7" rx="1.5" fill="#60a5fa"/>
  <rect x="97" y="272" width="7" height="7" rx="1.5" fill="#60a5fa"/>
  <rect x="86" y="283" width="7" height="7" rx="1.5" fill="#60a5fa"/>
  <rect x="97" y="283" width="7" height="7" rx="1.5" fill="#60a5fa"/>
  <text x="120" y="292" font-size="19" font-weight="700" fill="#0f172a">입력 데이터</text>
  <text x="86" y="316" font-size="14" fill="#64748b">숫자를 담은 텐서</text>
  <text x="86" y="336" font-size="13" fill="#2563eb" font-family="Consolas,Menlo,monospace">x</text>

  <rect x="300" y="252" width="190" height="96" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#boxShadow)"/>
  <rect x="322" y="270" width="20" height="20" rx="3" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="332" y1="270" x2="332" y2="290" stroke="#2563eb" stroke-width="1.2"/>
  <line x1="322" y1="280" x2="342" y2="280" stroke="#2563eb" stroke-width="1.2"/>
  <text x="356" y="292" font-size="19" font-weight="700" fill="#0f172a">행렬곱</text>
  <text x="322" y="316" font-size="14" fill="#64748b">곱해서 더하기 (내적)</text>
  <text x="322" y="336" font-size="13" fill="#2563eb" font-family="Consolas,Menlo,monospace">nn.Linear(n, m)</text>

  <rect x="536" y="252" width="190" height="96" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#boxShadow)"/>
  <polyline points="558,290 568,290 578,270" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="592" y="292" font-size="19" font-weight="700" fill="#0f172a">활성함수</text>
  <text x="558" y="316" font-size="14" fill="#64748b">직선을 곡선으로</text>
  <text x="558" y="336" font-size="13" fill="#2563eb" font-family="Consolas,Menlo,monospace">nn.ReLU()</text>

  <rect x="772" y="252" width="190" height="96" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
  <circle cx="804" cy="280" r="10" fill="none" stroke="#0d9488" stroke-width="1.8"/>
  <circle cx="804" cy="280" r="3.5" fill="#0d9488"/>
  <text x="828" y="292" font-size="19" font-weight="700" fill="#0f172a">출력</text>
  <text x="794" y="316" font-size="14" fill="#64748b">다음 층으로 전달</text>
  <text x="794" y="336" font-size="13" fill="#0d9488" font-family="Consolas,Menlo,monospace">pred</text>

  <line x1="262" y1="300" x2="286" y2="300" stroke="#2563eb" stroke-width="2"/>
  <polygon points="286,294 296,300 286,306" fill="#2563eb"/>
  <line x1="498" y1="300" x2="522" y2="300" stroke="#2563eb" stroke-width="2"/>
  <polygon points="522,294 532,300 522,306" fill="#2563eb"/>
  <line x1="734" y1="300" x2="758" y2="300" stroke="#2563eb" stroke-width="2"/>
  <polygon points="758,294 768,300 758,306" fill="#2563eb"/>

  <path d="M 300 362 L 300 372 L 726 372 L 726 362" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
  <path d="M 513 372 L 513 380" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="513" y="398" font-size="15" fill="#475569" text-anchor="middle">신경망이 하는 계산은 사실상 이 둘뿐이다</text>

  <text x="64" y="462" font-size="20" font-weight="700" fill="#1e3a5f">② 학습 4단계 — 에폭 수만큼 반복</text>
  <rect x="452" y="444" width="122" height="26" rx="13" fill="#dbeafe"/>
  <text x="513" y="462" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">chap02~05</text>

  <rect x="64" y="512" width="190" height="96" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#boxShadow)"/>
  <text x="86" y="546" font-size="13" font-weight="700" fill="#93c5fd">01</text>
  <text x="114" y="546" font-size="19" font-weight="700" fill="#0f172a">순전파</text>
  <text x="86" y="570" font-size="14" fill="#64748b">일단 찍어본다</text>
  <text x="86" y="590" font-size="13" fill="#2563eb" font-family="Consolas,Menlo,monospace">pred = model(x)</text>

  <rect x="300" y="512" width="190" height="96" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#boxShadow)"/>
  <text x="322" y="546" font-size="13" font-weight="700" fill="#93c5fd">02</text>
  <text x="350" y="546" font-size="19" font-weight="700" fill="#0f172a">손실</text>
  <text x="322" y="570" font-size="14" fill="#64748b">얼마나 틀렸나</text>
  <text x="322" y="590" font-size="13" fill="#2563eb" font-family="Consolas,Menlo,monospace">loss_fn(pred, y)</text>

  <rect x="536" y="512" width="190" height="96" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#boxShadow)"/>
  <text x="558" y="546" font-size="13" font-weight="700" fill="#93c5fd">03</text>
  <text x="586" y="546" font-size="19" font-weight="700" fill="#0f172a">역전파</text>
  <text x="558" y="570" font-size="14" fill="#64748b">어느 쪽으로 고칠까</text>
  <text x="558" y="590" font-size="13" fill="#2563eb" font-family="Consolas,Menlo,monospace">loss.backward()</text>

  <rect x="772" y="512" width="190" height="96" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#boxShadow)"/>
  <text x="794" y="546" font-size="13" font-weight="700" fill="#5eead4">04</text>
  <text x="822" y="546" font-size="19" font-weight="700" fill="#0f172a">옵티마이저</text>
  <text x="794" y="570" font-size="14" fill="#64748b">그쪽으로 조금 움직인다</text>
  <text x="794" y="590" font-size="13" fill="#0d9488" font-family="Consolas,Menlo,monospace">optimizer.step()</text>

  <line x1="262" y1="560" x2="286" y2="560" stroke="#2563eb" stroke-width="2"/>
  <polygon points="286,554 296,560 286,566" fill="#2563eb"/>
  <line x1="498" y1="560" x2="522" y2="560" stroke="#2563eb" stroke-width="2"/>
  <polygon points="522,554 532,560 522,566" fill="#2563eb"/>
  <line x1="734" y1="560" x2="758" y2="560" stroke="#2563eb" stroke-width="2"/>
  <polygon points="758,554 768,560 758,566" fill="#2563eb"/>

  <text x="513" y="636" font-size="15" fill="#0f766e" text-anchor="middle">가중치가 조금씩 고쳐진다 → 오차가 줄어든다</text>
  <path d="M 867 608 L 867 650 L 159 650 L 159 622" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="153,622 159,610 165,622" fill="#0d9488"/>

  <rect x="64" y="692" width="1052" height="66" rx="10" fill="#eef2f7"/>
  <rect x="64" y="692" width="6" height="66" rx="3" fill="#1e3a5f"/>
  <text x="96" y="722" font-size="18" font-weight="700" fill="#1e3a5f">층을 몇 개 쌓든, 데이터가 이미지든 문장이든 — 계산은 위 두 가지뿐이다.</text>
  <text x="96" y="746" font-size="15" fill="#334155">CNN·RNN·트랜스포머는 ①의 모양만 바꾼 것이고, ②의 4단계는 끝까지 그대로다.</text>
</svg>
